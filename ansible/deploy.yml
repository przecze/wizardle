# =============================================================================
# WIZARDLE PROJECT DEPLOYMENT PLAYBOOK
# =============================================================================
#
# SAFETY GUARANTEES:
#
# 1. TARGET DIRECTORY: Only /srv/projects/wizardle is touched
#    - All file operations use project_dir variable
#
# 2. DATA FILES:
#    - input/: raw source material, NEVER copied to server
#
# 3. NGINX-PROXY INTEGRATION:
#    - Connects to existing nginx-proxy network (external: true)
#    - Sets VIRTUAL_HOST=wizardle.net
#    - Does NOT modify /srv/projects/nginx-proxy/ files
#
# 4. DOCKER COMMANDS: Only these docker operations are performed:
#    - docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production build backend site (pre-build)
#    - docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d --force-recreate --remove-orphans backend site
#    All scoped to /srv/projects/wizardle/docker-compose.yml (+ docker-compose.prod.yml overlay:
#    disables backend --reload and its dev bind mount so prod runs the built image, not a live
#    host mount, and doesn't pay for the reload watcher subprocess)
#
# =============================================================================

- name: Deploy wizardle project
  hosts: bluh

  vars:
    project_dir: /srv/projects/wizardle

  tasks:
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Sync project files to server
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/"
        delete: no
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=venv"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=ansible"
          - "--exclude=.DS_Store"
          - "--exclude=*.backup.*"
          - "--exclude=*_api_key.txt"
          - "--exclude=fragment_context_cache"
          # Never copy raw input files to the server
          - "--exclude=input"
          # Large source CSV - use checksum to skip if unchanged
          - "--checksum"

    - name: Copy OpenRouter API key (never synced via rsync)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../openrouter_prod_api_key.txt"
        dest: "{{ project_dir }}/openrouter_prod_api_key.txt"
        mode: '0600'

    - name: Ensure fragment context cache directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}/fragment_context_cache"
        state: directory
        mode: '0755'

    - name: Build images (production profile)
      ansible.builtin.shell: |
        cd {{ project_dir }} && docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production build backend site

    - name: Start containers (production profile)
      ansible.builtin.shell: |
        cd {{ project_dir }} && docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d --force-recreate --remove-orphans backend site
      register: docker_result

    - name: Show docker compose output
      ansible.builtin.debug:
        var: docker_result.stdout_lines

    - name: Check container status
      ansible.builtin.shell: |
        cd {{ project_dir }} && docker compose ps
      register: ps_result

    - name: Show running containers
      ansible.builtin.debug:
        var: ps_result.stdout_lines
